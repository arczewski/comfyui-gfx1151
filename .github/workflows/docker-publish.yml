name: Build & Publish + Auto-Merge

#
# Builds the ComfyUI-gfx1151 Docker image on push to develop/master,
# pushes to Docker Hub & GHCR, auto-merges develop → master on success,
# and sends push notifications.
#

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'develop'

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Determine tags ---
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,pattern={{branch}}
            type=ref,event=tag,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short

      # --- Registry logins ---
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build & push ---
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # --- Notification on failure (only in build step) ---
      - name: Notify failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          curl -s --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
               --form-string "user=${{ secrets.PUSHOVER_USER }}" \
               --form-string "title=❌ ComfyUI-gfx1151 Build FAILED" \
               --form-string "message=Build failed on ${{ github.ref_name }} (${{ github.sha }})&#10;${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               --form-string "priority=1" \
               --form-string "sound=siren" \
               --form-string "html=1" \
               https://api.pushover.net/1/messages.json

  # ──────────────────────────────────────────────
  # Auto-merge: after successful develop build,
  # create a PR from develop → master (or just merge directly)
  # ──────────────────────────────────────────────
  auto-merge:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop → master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout master
          git merge --ff-only origin/develop
          git push origin master
          echo "✅ Merged develop into master (fast-forward)"

  # ──────────────────────────────────────────────
  # Success notification (runs after build-push)
  # ──────────────────────────────────────────────
  notify-success:
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Extract image info
        id: info
        run: |
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Notify success via Pushover
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "master" ]; then
            TAG="latest"
          fi

          curl -s --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
               --form-string "user=${{ secrets.PUSHOVER_USER }}" \
               --form-string "title=✅ ComfyUI-gfx1151 Built & Published" \
               --form-string "message=Image <b>${{ secrets.DOCKERHUB_USERNAME }}/comfyui-gfx1151:$TAG</b> pushed successfully&#10;Branch: <b>${{ github.ref_name }}</b>&#10;Commit: <b>${{ steps.info.outputs.sha_short }}</b>&#10;<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Workflow run</a>" \
               --form-string "priority=0" \
               --form-string "sound=magic" \
               --form-string "html=1" \
               --form-string "url=${{ github.server_url }}/${{ github.repository }}/pkgs/container/comfyui-gfx1151" \
               --form-string "url_title=GHCR Package" \
               https://api.pushover.net/1/messages.json
