name: Build & Publish + Auto-Merge

#
# Builds the ComfyUI-gfx1151 Docker image on push to develop/master,
# pushes to GHCR (always) + Docker Hub (if secrets configured),
# auto-merges develop -> master on success, and sends push notifications.
#

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build metadata ---
      - name: Docker meta (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,pattern={{branch}}
            type=ref,event=tag,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short

      # --- Registry login ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Docker Hub (optional) ---
      - name: Login to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub tags
        id: dh-tags
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          # Generate Docker Hub tags matching GHCR pattern
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}"
          BRANCH="${{ github.ref_name }}"
          SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          TAGS="${REPO}:${BRANCH}"
          TAGS="${TAGS},${REPO}:${SHA}"
          if [ "$BRANCH" = "master" ]; then
            TAGS="${TAGS},${REPO}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Combine all tags
        id: combined
        run: |
          ALL_TAGS="${{ steps.meta.outputs.tags }}"
          if [ -n "${{ steps.dh-tags.outputs.tags }}" ]; then
            ALL_TAGS="${ALL_TAGS}"$'\n'"${{ steps.dh-tags.outputs.tags }}"
          fi
          # Multi-line output needs heredoc syntax
          { echo "tags<<TAGEOF"; echo "${ALL_TAGS}"; echo "TAGEOF"; } >> $GITHUB_OUTPUT

      # --- Build & push ---
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.combined.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # --- Failure notification ---
      - name: Notify failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          curl -s --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
               --form-string "user=${{ secrets.PUSHOVER_USER }}" \
               --form-string "title=❌ ComfyUI-gfx1151 Build FAILED" \
               --form-string "message=Build failed on <b>${{ github.ref_name }}</b>&#10;Commit: <b>$(echo '${{ github.sha }}' | cut -c1-7)</b>&#10;<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Workflow run</a>" \
               --form-string "priority=1" \
               --form-string "sound=siren" \
               --form-string "html=1" \
               https://api.pushover.net/1/messages.json

  # ──────────────────────────────────────────────
  # Auto-merge develop -> master after success
  # ──────────────────────────────────────────────
  auto-merge:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop -> master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master
          git merge --ff-only origin/develop
          git push origin master
          echo "✅ Merged develop into master (fast-forward)"

  # ──────────────────────────────────────────────
  # Success notification
  # ──────────────────────────────────────────────
  notify-success:
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Notify success via Pushover
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "master" ]; then
            TAG="latest"
          fi
          SHA="$(echo '${{ github.sha }}' | cut -c1-7)"

          MSG="Image <b>ghcr.io/${{ github.repository }}:${TAG}</b> published&#10;Branch: <b>${{ github.ref_name }}</b>&#10;Commit: <b>${SHA}</b>"

          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            MSG="${MSG}&#10;Docker Hub: <b>${{ secrets.DOCKERHUB_USERNAME }}/comfyui-gfx1151:${TAG}</b>"
          fi

          MSG="${MSG}&#10;<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Workflow run</a>"

          curl -s --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
               --form-string "user=${{ secrets.PUSHOVER_USER }}" \
               --form-string "title=✅ ComfyUI-gfx1151 Built & Published" \
               --form-string "message=${MSG}" \
               --form-string "priority=0" \
               --form-string "sound=magic" \
               --form-string "html=1" \
               --form-string "url=${{ github.server_url }}/${{ github.repository }}/pkgs/container/comfyui-gfx1151" \
               --form-string "url_title=GHCR Package" \
               https://api.pushover.net/1/messages.json
