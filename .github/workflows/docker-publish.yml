name: Build & Publish + Auto-Merge

#
# Builds the ComfyUI-gfx1151 Docker image on push to develop/master,
# pushes to GHCR (always) + Docker Hub (if secrets configured),
# auto-merges develop -> master on success, and sends push notifications.
#

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'develop'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build metadata (tags/labels) ---
      # Always build GHCR tags; conditionally add Docker Hub tags
      - name: Docker meta (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,pattern={{branch}}
            type=ref,event=tag,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
          flavor: |
            latest=false

      - name: Docker meta (Docker Hub)
        id: meta-dockerhub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch,pattern={{branch}}
            type=ref,event=tag,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=,format=short
          flavor: |
            latest=false
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # --- Registry logins ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      # --- Build & push ---
      - name: Combine tags
        id: tags
        run: |
          TAGS="${{ steps.meta-ghcr.outputs.tags }}"
          if [ -n "${{ steps.meta-dockerhub.outputs.tags }}" ]; then
            TAGS="$TAGS"$'\n'"${{ steps.meta-dockerhub.outputs.tags }}"
          fi
          # Output as comma-separated for docker/build-push
          TAGS_CSV="$(echo "$TAGS" | tr '\n' ',' | sed 's/,$//')"
          echo "tags=$TAGS_CSV" >> $GITHUB_OUTPUT
          echo "ghcr_tags=${{ steps.meta-ghcr.outputs.tags }}" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # --- Failure notification ---
      - name: Notify failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          curl -s --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
               --form-string "user=${{ secrets.PUSHOVER_USER }}" \
               --form-string "title=❌ ComfyUI-gfx1151 Build FAILED" \
               --form-string "message=Build failed on <b>${{ github.ref_name }}</b> (${{ github.sha }})&#10;<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Workflow run</a>" \
               --form-string "priority=1" \
               --form-string "sound=siren" \
               --form-string "html=1" \
               https://api.pushover.net/1/messages.json

  # ──────────────────────────────────────────────
  # Auto-merge: after successful develop build,
  # fast-forward merge develop -> master
  # ──────────────────────────────────────────────
  auto-merge:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop -> master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master
          git merge --ff-only origin/develop
          git push origin master
          echo "✅ Merged develop into master (fast-forward)"

  # ──────────────────────────────────────────────
  # Success notification
  # ──────────────────────────────────────────────
  notify-success:
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Notify success via Pushover
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "master" ]; then
            TAG="latest"
          fi

          # Build the message with links to both registries
          MESSAGE="Image <b>ghcr.io/${{ github.repository }}:$TAG</b> pushed successfully&#10;Branch: <b>${{ github.ref_name }}</b>&#10;Commit: <b>$(echo '${{ github.sha }}' | cut -c1-7)</b>"

          # Add Docker Hub info if available
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            MESSAGE="$MESSAGE&#10;Docker Hub: <b>${{ secrets.DOCKERHUB_USERNAME }}/comfyui-gfx1151:$TAG</b>"
          fi

          MESSAGE="$MESSAGE&#10;<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Workflow run</a>"

          curl -s --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
               --form-string "user=${{ secrets.PUSHOVER_USER }}" \
               --form-string "title=✅ ComfyUI-gfx1151 Built & Published" \
               --form-string "message=$MESSAGE" \
               --form-string "priority=0" \
               --form-string "sound=magic" \
               --form-string "html=1" \
               --form-string "url=${{ github.server_url }}/${{ github.repository }}/pkgs/container/comfyui-gfx1151" \
               --form-string "url_title=GHCR Package" \
               https://api.pushover.net/1/messages.json
